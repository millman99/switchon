<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스위치온 4주 관리</title>
<style>
:root{
  --bg:#F4F7F4; --card:#FFFFFF; --ink:#1C2A24; --sub:#5F7167; --line:#DEE7E0;
  --on:#0E7C66; --on-deep:#0A5C4C; --on-soft:#E3F1EC;
  --fast:#B9791F; --fast-soft:#FBF1DF;
  --danger:#BE4438; --danger-soft:#F9E9E7;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard','Noto Sans KR',-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
  font-size:15px; line-height:1.55;
  padding-bottom:76px;
}
h1,h2,h3{margin:0; line-height:1.3;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px; color:var(--ink);}
.wrap{max-width:1180px; margin:0 auto; padding:14px 14px 0;}

/* ── 스위치 배너 (시그니처) ── */
.switchbar{
  background:linear-gradient(135deg,var(--on-deep),var(--on));
  color:#fff; border-radius:18px; padding:16px 18px; margin-bottom:14px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.switchbar.fasting{background:linear-gradient(135deg,#8A5A12,var(--fast));}
.switchbar.maint{background:linear-gradient(135deg,#2E4A3E,#4E7364);}
